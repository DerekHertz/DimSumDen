name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Read Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      # organism-infra/183: the old install form that also ran apt-get hung for the whole
      # job timeout on PR #179. ubuntu-latest ships Chrome, which the smoke check tries first,
      # so this is only the fallback browser: no apt, a hard per-attempt timeout, one retry.
      - name: Install Playwright's Chromium (smoke check's fallback browser)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            timeout -k 10 180 npx playwright install chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - name: Run tests
        run: npm test

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action calls GET /pulls/{n}/commits on pull_request events; without
      # this the call 403s ("Resource not accessible by integration", header
      # x-accepted-github-permissions: pull_requests=read) before any scanning
      # happens. Confirmed in CI run 36376905451 -- not a leaked secret finding.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
