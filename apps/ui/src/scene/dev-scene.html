<!doctype html>
<!-- Ticket 04 dev scene: wires the character director (packages/character-director) to one cell
     built from apps/ui/public/models/panda.glb, driven by a mock state source's dev control.
     State is shown by pose AND by icon + word, never by motion alone.
     Run from the repo root (the scene imports packages/): python -m http.server 8124
     then open http://localhost:8124/apps/ui/src/scene/dev-scene.html
     On Windows, Python may serve .mjs as text/plain, which browsers refuse; map .mjs to text/javascript. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell state: dev scene</title>
  <style>
    :root {
      --bg: #efe8d8; --panel: #fffdf7; --ink: #1d2124; --muted: #5a605d; --faint: #80847c; --line: #d8ceb8; --qi: #006c71;
      --lantern: #905d00; --lantern-fill: #f8bd40; --on-lantern: #1b1d20; --alarm: #c1291b; --alarm-fill: #c1291b; --on-alarm: #fffdf7;
      --throttled: #626a75; --shadow-panel: 0 8px 24px rgba(74,58,24,0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111418; --panel: #1f252b; --ink: #eceee9; --muted: #a4ada9; --faint: #7a8480; --line: #343d45; --qi: #3aced3;
        --lantern: #f8bd40; --alarm: #f45340; --alarm-fill: #f45340; --on-alarm: #111418;
        --throttled: #8d96a3; --shadow-panel: 0 12px 32px rgba(0,0,0,0.5);
      }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/20px Nunito, system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; box-sizing: border-box; }
    #hud h1 { font-size: 16px; line-height: 22px; margin: 0 0 8px; }
    h2 { font-size: 12px; line-height: 16px; margin: 8px 0 4px; color: var(--muted); font-weight: 700; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; }
    button { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: var(--qi); color: var(--qi); }
    button:focus-visible { outline: 2px solid var(--qi); outline-offset: 2px; }
    #state-badge { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; margin-top: 8px; }
    #state-badge .icon svg { display: block; width: 24px; height: 24px; }
    /* State colours (design system tokens state-*): only waiting and failed use the reserved hues. */
    [data-state="idle"], [data-state="terminated"] { --state: var(--faint); }
    [data-state="working"] { --state: var(--qi); }
    [data-state="waiting_on_user"] { --state: var(--lantern); }
    [data-state="blocked"] { --state: var(--muted); }
    [data-state="done"] { --state: var(--ink); }
    [data-state="failed"] { --state: var(--alarm); }
    [data-state="throttled"] { --state: var(--throttled); }
    #state-badge .icon { color: var(--state); }
    /* Emote bubble: a round speech bubble over the panda's head holding the state's line icon. */
    #emote-bubble { position: fixed; left: 0; top: 0; width: 48px; height: 48px; box-sizing: border-box; padding: 10px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-panel); color: var(--state);
      pointer-events: none; transform: translate(-50%, calc(-100% - 8px)); }
    #emote-bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; margin-left: -5px;
      background: inherit; border: inherit; border-top: 0; border-left: 0; transform: rotate(45deg); }
    #emote-bubble[data-state="waiting_on_user"] { background: var(--lantern-fill); border-color: var(--lantern-fill); color: var(--on-lantern); }
    #emote-bubble[data-state="failed"] { background: var(--alarm-fill); border-color: var(--alarm-fill); color: var(--on-alarm); }
    #emote-bubble svg { display: block; width: 100%; height: 100%; }
    #status { font: 12px/16px ui-monospace, monospace; color: var(--muted); white-space: pre; margin-top: 8px; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="hud">
    <h1>Cell state (dev control)</h1>
    <h2>State</h2><div class="row" id="states"></div>
    <h2>Cell type (ticket 07 idle habits)</h2><div class="row" id="cell-types"></div>
    <h2>Reduced motion</h2><div class="row" id="reduced-motion"></div>
    <!-- State is shown by icon + word here, never by pose alone. -->
    <div id="state-badge"><span class="icon" id="state-icon"></span><span id="state-word"></span></div>
    <div id="status">loading…</div>
  </div>
  <!-- The state's emote bubble over the cell's head (the HUD badge above carries the word). -->
  <div id="emote-bubble" aria-hidden="true"></div>
  <script type="module" src="./dev-scene.mjs"></script>
</body>
</html>
