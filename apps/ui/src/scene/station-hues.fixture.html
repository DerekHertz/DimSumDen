<!doctype html><html><body><div id="root" style="width:800px;height:600px"></div><script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { Canvas } from "@react-three/fiber";
import { Market } from "./Market.jsx";
window.mounts = 0;
createRoot(document.getElementById("root")).render(React.createElement(Canvas, { onCreated: ({scene}) => { window.marketScene = scene; window.mounts++; } }, React.createElement(Market, { baskets: [], handoffs: [], cells: [], counts: {} })));
window.trimHues = () => {
  const hues = {};
  window.marketScene?.traverse(object => {
    if (!object.name.startsWith("kiosk:")) return;
    object.traverse(child => {
      if (child.geometry?.parameters?.height === 0.06) hues[object.name.slice(6)] = "#" + child.material.color.getHexString().toUpperCase();
    });
  });
  return hues;
};
</script></body></html>
